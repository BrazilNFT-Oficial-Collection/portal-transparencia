<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal da Transparência - Brazil NFT Official Collection</title>
    
    <link rel="icon" href="https://github.com/BrazilNFT-Oficial-Collection.png" type="image/png">

    <style>
        :root {
            --primary: #00ff9d;
            --dark: #0A2540;
        }
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        body {
            background-color: var(--dark);
            color: #ffffff !important;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        header {
            background: rgba(10, 37, 64, 0.98);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 255, 157, 0.25);
        }
        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.85rem;
            font-weight: bold;
            color: #ffffff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            font-size: 3rem;
            margin: 2.5rem 0 0.5rem;
            color: #ffffff !important;
        }
        .subtitle {
            text-align: center;
            color: #ffffff !important;
            font-size: 1.5rem;
            margin-bottom: 2rem;
        }

        .secondary-menu {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            margin: 2rem 0 3rem;
            flex-wrap: wrap;
        }
        .secondary-menu a {
            color: #ffffff !important;
            text-decoration: none;
            font-weight: 500;
            padding: 10px 24px;
            border-radius: 50px;
            transition: all 0.3s;
        }
        .secondary-menu a:hover,
        .secondary-menu a.active {
            background: rgba(0, 255, 157, 0.2);
            color: #ffffff !important;
        }

        /* Container Responsivo do Explorer */
        .iframe-container {
            position: relative;
            width: 100%;
            max-width: 1100px;
            margin: 1.5rem auto;
            padding-bottom: 65%;           /* Proporção ajustada */
            height: 0;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 255, 157, 0.15);
        }
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.4rem; }
            .subtitle { font-size: 1.3rem; }
            .secondary-menu { gap: 1.2rem; }
            .secondary-menu a { padding: 9px 18px; font-size: 0.95rem; }
            .iframe-container { padding-bottom: 90%; }   /* Mais alto no mobile */
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">🇧🇷 Brazil NFT</div>
        </nav>
    </header>

    <div class="container">
        <h1>Portal da Transparência</h1>
        <p class="subtitle">Brazil NFT Official Collection</p>

        <div class="secondary-menu">
            <a href="index.html" class="active">Transparência</a>
            <a href="roadmap.html">Roadmap</a>
        </div>

        <!-- Explorer Responsivo -->
        <div class="iframe-container">
            <iframe src="https://explorer.contentos.io/#/user-relevant/vulkan" 
                    allowfullscreen 
                    title="Contentos Explorer - Vulkan"></iframe>
        </div>
    </div>
</body>
</html>
