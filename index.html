<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal da Transparência - Brazil NFT Official Collection</title>
    <link rel="icon" href="assets/favicon/favicon.png" type="image/png">

    <style>
        :root {
            --primary: #00ff9d;
            --dark: #0A2540;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--dark);
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        header {
            background: rgba(10, 37, 64, 0.98);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 255, 157, 0.25);
        }
        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            font-size: 1.85rem;
            font-weight: bold;
            color: #ffffff;
        }
        .main-menu {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .main-menu a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 50px;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .main-menu a:hover,
        .main-menu a.active {
            background: rgba(0, 255, 157, 0.2);
            color: var(--primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            font-size: 2.8rem;
            margin: 2.5rem 0 0.5rem;
        }
        .subtitle {
            text-align: center;
            color: var(--primary);
            font-size: 1.4rem;
            margin-bottom: 2rem;
        }

        .explorer-wrapper {
            width: 100%;
            max-width: 1100px;
            margin: 2rem auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 255, 157, 0.15);
        }
        .explorer-wrapper iframe {
            width: 100%;
            height: 680px;
            border: none;
        }

        footer {
            background: #ffffff;
            color: #0A2540;
            padding: 3rem 2rem 2rem;
            margin-top: 5rem;
            border-top: 1px solid rgba(0, 255, 157, 0.3);
            text-align: center;
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 1.6rem;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }
        .social-icons img, .social-icons span {
            transition: all 0.3s;
        }
        .social-icons img {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }
        .social-icons span {
            font-size: 2.3rem;
        }
        .social-icons a:hover img,
        .social-icons a:hover span {
            transform: translateY(-5px);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.3rem; }
            .explorer-wrapper iframe { height: 520px; }
            .main-menu a { padding: 8px 14px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">🇧🇷 Brazil NFT</div>
            <div class="main-menu">
                <a href="index.html" class="active">Transparência</a>
                <a href="roadmap.html">Roadmap</a>
                <a href="artworks.html">Artworks</a>
                <a href="galeria.html">Galeria</a>
                <a href="tradingview.html">TradingView</a>
            </div>
        </nav>
    </header>

    <div class="container">
        <h1>Portal da Transparência</h1>
        <p class="subtitle">Brazil NFT Official Collection</p>
        
        <div class="explorer-wrapper">
            <iframe src="https://explorer.contentos.io/#/user-relevant/vulkan" 
                    allowfullscreen 
                    scrolling="yes" 
                    title="Contentos Explorer"></iframe>
        </div>
    </div>

    <footer>
        <div class="social-icons">
            <a href="https://www.binance.com/pt-BR/square/profile/cos_investidores" target="_blank" title="Binance Square">
                <img src="assets/Bsquare.png" alt="Binance Square">
            </a>
            <a href="https://x.com/BrazilPfp" target="_blank" title="X / Twitter">
                <span>𝕏</span>
            </a>
            <a href="https://github.com/BrazilNFT-Oficial-Collection" target="_blank" title="Github">
                <img src="assets/git.png" alt="Github">
            </a>
            <a href="https://cos.tv/channel-vip/room/172133888776684" target="_blank" title="Sala VIP COStv">
                <img src="assets/salavip.png" alt="Sala VIP">
            </a>
            <a href="https://cos.tv/channel/51060419739952128/" target="_blank" title="Canal Oficial COStv">
                <img src="assets/costve.png" alt="Canal COStv">
            </a>
        </div>
        <div class="footer-text">
            <p>&copy; 2026 Brazil NFT Official Collection • Todos os direitos reservados</p>
            <p>Transparência é o nosso compromisso com a comunidade.</p>
        </div>
    </footer>
</body>
</html>
