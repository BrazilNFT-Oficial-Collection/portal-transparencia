<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artworks - Brazil NFT Official Collection</title>
    <link rel="icon" href="assets/favicon.png" type="image/png">

    <style>
        :root {
            --primary: #00ff9d;
            --dark: #0A2540;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--dark);
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        header {
            background: rgba(10, 37, 64, 0.98);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 255, 157, 0.25);
        }
        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            font-size: 1.85rem;
            font-weight: bold;
            color: #ffffff;
        }
        .main-menu {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .main-menu a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 50px;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .main-menu a:hover,
        .main-menu a.active {
            background: rgba(0, 255, 157, 0.2);
            color: var(--primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            font-size: 3rem;
            margin: 2.5rem 0 1rem;
        }
        .subtitle {
            text-align: center;
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 3rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.8rem;
        }
        .art-card {
            background: #112B4A;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s;
            border: 1px solid rgba(0, 255, 157, 0.1);
        }
        .art-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 40px rgba(0, 255, 157, 0.2);
        }
        .art-card img {
            width: 100%;
            height: auto;
            max-height: 380px;
            object-fit: contain;
            background: #0A2540;
            padding: 15px;
        }
        .art-info {
            padding: 1.2rem;
            text-align: center;
        }
        .art-info h3 {
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        footer {
            background: #ffffff;
            color: #0A2540;
            padding: 3rem 2rem 2rem;
            margin-top: 5rem;
            border-top: 1px solid rgba(0, 255, 157, 0.3);
            text-align: center;
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 1.6rem;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }
        .social-icons img {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }
        .social-icons span {
            font-size: 2.3rem;
        }
        .social-icons a:hover img,
        .social-icons a:hover span {
            transform: translateY(-5px);
        }
        .footer-text {
            color: #0A2540;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-top: 1rem;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.4rem; }
            .main-menu a { padding: 8px 14px; font-size: 0.95rem; }
            .art-card img { max-height: 320px; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">🇧🇷 Brazil NFT</div>
            <div class="main-menu">
                <a href="index.html">Transparência</a>
                <a href="roadmap.html">Roadmap</a>
                <a href="artworks.html" class="active">Artworks</a>
                <a href="galeria.html">Galeria</a>
                <a href="tradingview.html">TradingView</a>
            </div>
        </nav>
    </header>

    <div class="container">
        <h1>Artworks</h1>
        <p class="subtitle">Brazil NFT Official Collection</p>

        <div class="gallery">
            <div class="art-card">
                <img src="assets/panter (1).png" alt="Panther">
                <div class="art-info">
                    <h3>Panther</h3>
                </div>
            </div>
            <div class="art-card">
                <img src="assets/boaconstrictorsnake.png" alt="Boa Constrictor">
                <div class="art-info">
                    <h3>Boa Constrictor</h3>
                </div>
            </div>
            <div class="art-card">
                <img src="assets/capybara.png" alt="Capybara">
                <div class="art-info">
                    <h3>Capybara</h3>
                </div>
            </div>
            <div class="art-card">
                <img src="assets/manedwolf.png" alt="Maned Wolf">
                <div class="art-info">
                    <h3>Maned Wolf</h3>
                </div>
            </div>
            <div class="art-card">
                <img src="assets/capuchinmonkey.png" alt="Capuchin Monkey">
                <div class="art-info">
                    <h3>Capuchin Monkey</h3>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="social-icons">
            <a href="https://www.binance.com/pt-BR/square/profile/cos_investidores" target="_blank" title="Binance Square"><img src="assets/Bsquare.png" alt="Binance Square"></a>
            <a href="https://x.com/BrazilPfp" target="_blank" title="X / Twitter"><span>𝕏</span></a>
            <a href="https://github.com/BrazilNFT-Oficial-Collection" target="_blank" title="Github"><img src="assets/git.png" alt="Github"></a>
            <a href="https://cos.tv/channel-vip/room/172133888776684" target="_blank" title="Sala VIP COStv"><img src="assets/salavip.png" alt="Sala VIP"></a>
            <a href="https://cos.tv/channel/51060419739952128/" target="_blank" title="Canal Oficial COStv"><img src="assets/costve.png" alt="Canal COStv"></a>
        </div>
        <div class="footer-text">
            <p>&copy; 2026 Brazil NFT Official Collection • Todos os direitos reservados</p>
            <p>Transparência é o nosso compromisso com a comunidade.</p>
        </div>
    </footer>
</body>
</html>
