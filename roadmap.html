<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap - Brazil NFT Official Collection</title>
    
    <link rel="icon" href="https://github.com/BrazilNFT-Oficial-Collection.png" type="image/png">

    <style>
        :root {
            --primary: #00ff9d;
            --dark: #0A2540;
            --gray: #112B4A;
        }
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        body {
            background-color: var(--dark);
            color: #ffffff !important;
            font-family: 'Segoe UI', system-ui, sans-serif;
            line-height: 1.6;
        }
        header {
            background: rgba(10, 37, 64, 0.98);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 255, 157, 0.25);
        }
        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.85rem;
            font-weight: bold;
            color: #ffffff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            font-size: 3rem;
            margin: 3rem 0 2.5rem;
            color: #ffffff !important;
        }

        /* Menu limpo */
        .secondary-menu {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            margin: 2rem 0 3rem;
            flex-wrap: wrap;
        }
        .secondary-menu a {
            color: #ffffff !important;
            text-decoration: none;
            font-weight: 500;
            padding: 10px 24px;
            border-radius: 50px;
            transition: all 0.3s;
        }
        .secondary-menu a:hover,
        .secondary-menu a.active {
            background: rgba(0, 255, 157, 0.2);
            color: #ffffff !important;
        }

        .pdf-container {
            background: var(--gray);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(0, 255, 157, 0.25);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }
        iframe {
            width: 100%;
            height: 920px;
            border: none;
            border-radius: 12px;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.4rem; }
            .secondary-menu { gap: 1rem; }
            .secondary-menu a { padding: 9px 18px; font-size: 0.95rem; }
            iframe { height: 680px; }
        }
                /* FOOTER - Branco com textos menores */
        footer {
            background: #ffffff !important;
            padding: 3rem 2rem 2rem;
            margin-top: 4rem;
            border-top: 1px solid rgba(0, 255, 157, 0.3);
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 2.2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .social-icons a {
            transition: all 0.3s;
        }
        .social-icons img {
            width: 52px;
            height: 52px;
            object-fit: contain;
        }
        .social-icons a:hover img {
            transform: translateY(-6px);
            filter: brightness(1.3);
        }
        .footer-text {
            text-align: center;
            color: #0A2540;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        .footer-text p {
            margin-bottom: 0.4rem;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">🇧🇷 Brazil NFT</div>
        </nav>
    </header>

    <div class="container">
        <h1>Roadmap 2026</h1>

        <!-- Menu -->
        <div class="secondary-menu">
            <a href="index.html">Transparência</a>
            <a href="roadmap.html" class="active">Roadmap</a>
        </div>

        <div class="pdf-container">
            <iframe src="roadmap.pdf" title="Roadmap Brazil NFT"></iframe>
        </div>

        <p style="text-align: center; margin-top: 20px;">
            <a href="roadmap.pdf" target="_blank" style="color: var(--primary); font-weight: bold;">
                📥 Baixar Roadmap em PDF
            </a>
        </p>
    </div>
        <!-- RODAPÉ -->
    <footer>
        <div class="social-icons">
            <a href="https://www.binance.com/pt-BR/square/profile/cos_investidores" target="_blank" title="Binance Square">
                <img src="https://upload.wikimedia.org/wikipedia/commons/9/9a/Binance-BNB-Icon-Logo.wine.svg" alt="Binance Square">
            </a>
            <a href="https://x.com/BrazilPfp" target="_blank" title="X / Twitter">
                <span style="font-size: 2.4rem;">𝕏</span>
            </a>
            <a href="https://cos.tv/channel-vip/room/172133888776684" target="_blank" title="Sala Vip COStv">
                <img src="assets/salavip.png" alt="Sala Vip COStv">
            </a>
            <a href="https://cos.tv/channel/51060419739952128/" target="_blank" title="Canal Oficial COStv">
                <img src="https://play-lh.googleusercontent.com/w-YarljHAryHAiqPlND6cwr5dtLw1tUdB8cg_7Vo05iM9WTkyx-oVL4hw_2xeSFor6Q" alt="Canal Oficial COStv">
            </a>
        </div>
       
        <div class="footer-text">
            <p>&copy; 2026 Brazil NFT Official Collection • Todos os direitos reservados</p>
            <p>Transparência é o nosso compromisso com a comunidade.</p>
        </div>
    </footer>
</body>
</html>
