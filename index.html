<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal da Transparência - Brazil NFT Official Collection</title>
    
    <link rel="icon" href="https://github.com/BrazilNFT-Oficial-Collection.png" type="image/png">

    <style>
        :root {
            --primary: #00ff9d;
            --dark: #0A2540;
            --gray: #112B4A;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--dark);
            color: #ffffff;           /* Branco */
            font-family: 'Segoe UI', system-ui, sans-serif;
            line-height: 1.6;
        }
        header {
            background: rgba(10, 37, 64, 0.98);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 255, 157, 0.25);
        }
        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.85rem;
            font-weight: bold;
            color: var(--primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            font-size: 3rem;
            margin: 2.5rem 0 0.5rem;
            color: #ffffff;
        }
        .subtitle {
            text-align: center;
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 2rem;
        }

        .secondary-menu {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            margin: 2rem 0 3rem;
            flex-wrap: wrap;
        }
        .secondary-menu a {
            color: #ffffff;           /* Branco */
            text-decoration: none;
            font-weight: 500;
            padding: 10px 24px;
            border-radius: 50px;
            transition: all 0.3s;
        }
        .secondary-menu a:hover,
        .secondary-menu a.active {
            background: rgba(0, 255, 157, 0.15);
            color: var(--primary);
        }

        iframe {
            width: 100%;
            max-width: 1100px;
            height: 680px;
            border: none;
            border-radius: 16px;
            margin: 1.5rem auto;
            display: block;
            box-shadow: 0 15px 35px rgba(0, 255, 157, 0.15);
        }

        .audio-player {
            text-align: center;
            margin: 3rem 0;
            background: var(--gray);
            padding: 30px;
            border-radius: 16px;
            color: #ffffff;           /* Branco */
        }
        .audio-player h2 {
            color: #ffffff;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.4rem; }
            .secondary-menu { gap: 1.2rem; }
            .secondary-menu a { padding: 9px 18px; font-size: 0.95rem; }
            iframe { height: 520px; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">🇧🇷 Brazil NFT</div>
        </nav>
    </header>

    <div class="container">
        <h1>Portal da Transparência</h1>
        <p class="subtitle">Brazil NFT Official Collection</p>

        <div class="secondary-menu">
            <a href="index.html" class="active">Transparência</a>
            <a href="roadmap.html">Roadmap</a>
        </div>

        <!-- Explorer -->
        <iframe src="https://explorer.contentos.io/#/user-relevant/vulkan" 
                allowfullscreen 
                title="Contentos Explorer - Vulkan"></iframe>

        <!-- Player -->
        <div class="audio-player">
            <h2>🎵 Casteler FM</h2>
            <audio controls style="width: 100%; max-width: 620px;">
                <source src="assets/music/lady.mp3" type="audio/mpeg">
                Seu navegador não suporta o elemento de áudio.
            </audio>
        </div>
    </div>
</body>
</html>
