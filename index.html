<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transparency Portal - Brazil NFT Official Collection</title>
    <link rel="icon" href="https://github.com/BrazilNFT-Oficial-Collection.png" type="image/png">
    <style>
        :root {
            --primary: #00ff9d;
            --dark: #0A2540;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--dark);
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        header {
            background: rgba(10, 37, 64, 0.98);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 255, 157, 0.25);
        }
        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.85rem;
            font-weight: bold;
            color: #ffffff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            font-size: 2.1rem;
            margin: 2.5rem 0 0.5rem;
        }
        .subtitle {
            text-align: center;
            color: #ffffff;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        .secondary-menu {
            display: flex;
            justify-content: center;
            gap: 1.8rem;
            margin: 2rem 0 3rem;
            flex-wrap: wrap;
        }
        .secondary-menu a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 20px;
            border-radius: 50px;
            transition: all 0.3s;
            font-size: 1rem;
        }
        .secondary-menu a:hover,
        .secondary-menu a.active {
            background: rgba(0, 255, 157, 0.15);
            color: #ffffff;
        }

        /* Explorer */
        .explorer-wrapper {
            width: 100%;
            max-width: 1100px;
            margin: 2rem auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 255, 157, 0.15);
        }
        .explorer-wrapper iframe {
            width: 100%;
            height: 720px;
            border: none;
        }

        /* TradingView Chart */
        .chart-wrapper {
            width: 100%;
            max-width: 1100px;
            margin: 3rem auto;
            background: #131722;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 255, 157, 0.15);
        }
        .chart-container {
            height: 720px;
            position: relative;
        }
        .chart-title {
            text-align: center;
            padding: 1.2rem 0;
            background: #0f172a;
            font-size: 1.35rem;
            border-bottom: 1px solid #1e2937;
        }

        footer {
            background: #ffffff !important;
            color: #0A2540;
            padding: 3rem 2rem 2rem;
            margin-top: 4rem;
            border-top: 1px solid rgba(0, 255, 157, 0.3);
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }
        .social-icons img {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }
        .social-icons a:hover img {
            transform: translateY(-6px);
            filter: brightness(1.3);
        }
        .footer-text {
            text-align: center;
            color: #0A2540;
            font-size: 0.78rem;
            line-height: 1.4;
        }

        @media (max-width: 768px) {
            .explorer-wrapper iframe, .chart-container {
                height: 520px;
            }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">🇧🇷 Brazil NFT</div>
        </nav>
    </header>

    <div class="container">
        <h1>Transparency Portal</h1>
        <p class="subtitle">Brazil NFT Official Collection</p>
      
        <div class="secondary-menu">
            <a href="index.html" class="active">Transparency</a>
            <a href="roadmap.html">Roadmap</a>
            <a href="galeria.html">Gallery</a>
        </div>

        <!-- Contentos Explorer -->
        <div class="explorer-wrapper">
            <iframe src="https://explorer.contentos.io/#/user-relevant/vulkan"
                    allowfullscreen
                    scrolling="yes"
                    title="Contentos Explorer"></iframe>
        </div>

        <!-- TradingView COS Chart -->
        <div class="chart-wrapper">
            <div class="chart-title">Crypto Total Market Cap (CRYPTOCAP:COS)</div>
            <div class="chart-container">
                <div id="tradingview_chart" style="height: 100%; width: 100%;"></div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="social-icons">
            <a href="https://www.binance.com/pt-BR/square/profile/cos_investidores" target="_blank" title="Binance Square">
                <img src="assets/Bsquare.png" alt="Binance Square">
            </a>
            <a href="https://x.com/BrazilPfp" target="_blank" title="X / Twitter">
                <span style="font-size: 2.4rem;">𝕏</span>
            </a>
            <a href="https://github.com/BrazilNFT-Oficial-Collection" target="_blank" title="Github">
                <img src="assets/git.png" alt="Perfil Github">
            </a>
            <a href="https://cos.tv/channel-vip/room/172133888776684" target="_blank" title="VIP Room COStv">
                <img src="assets/salavip.png" alt="Sala Vip COStv">
            </a>
            <a href="https://cos.tv/channel/51060419739952128/" target="_blank" title="Official Channel COStv">
                <img src="assets/costve.png" alt="Canal COStv">
            </a>
        </div>
        <div class="footer-text">
            <p>&copy; 2026 Brazil NFT Official Collection • All rights reserved</p>
            <p>Transparency is our commitment to the community.</p>
        </div>
    </footer>

    <!-- TradingView Script -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        new TradingView.widget({
            "width": "100%",
            "height": "100%",
            "symbol": "CRYPTOCAP:COS",
            "interval": "240",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "pt",
            "toolbar_bg": "#131722",
            "enable_publishing": false,
            "allow_symbol_change": true,
            "save_image": true,
            "container_id": "tradingview_chart"
        });
    </script>
</body>
</html>
