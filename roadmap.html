<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap - Brazil NFT Official Collection</title>
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <style>
        :root {
            --primary: #00ff9d;
            --dark: #0A2540;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--dark);
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        header {
            background: rgba(10, 37, 64, 0.98);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 255, 157, 0.25);
        }
        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            font-size: 1.85rem;
            font-weight: bold;
            color: #ffffff;
        }
        .secondary-menu {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .secondary-menu a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 50px;
            transition: all 0.3s;
            font-size: 1rem;
            white-space: nowrap;
        }
        .secondary-menu a:hover,
        .secondary-menu a.active {
            background: rgba(0, 255, 157, 0.15);
            color: var(--primary);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            font-size: 2.1rem;
            margin: 2.5rem 0 0.5rem;
        }
        .subtitle {
            text-align: center;
            color: #ffffff;
            font-size: 1.5rem;
            margin-bottom: 3rem;
        }
        .pdf-container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .pdf-container iframe {
            width: 100%;
            height: 750px;
            border: none;
            border-radius: 8px;
        }
        footer {
            background: #ffffff !important;
            color: #0A2540;
            padding: 3rem 2rem 2rem;
            margin-top: 4rem;
            border-top: 1px solid rgba(0, 255, 157, 0.3);
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 1.8rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }
        .social-icons img {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }
        .social-icons span {
            font-size: 2.4rem;
        }
        .footer-text {
            text-align: center;
            color: #0A2540;
            font-size: 0.78rem;
            line-height: 1.4;
        }
        @media (max-width: 768px) {
            nav {
                justify-content: center;
                text-align: center;
            }
            .secondary-menu {
                margin-top: 1rem;
            }
            .pdf-container iframe {
                height: 580px;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">🇧🇷 Brazil NFT</div>
            
            <div class="secondary-menu">
                <a href="index.html">Transparency</a>

                <a href="galeria.html">Gallery</a>
                <a href="tradingview.html">TradingView</a>
            </div>
        </nav>
    </header>

    <div class="container">
        <h1>Roadmap 2026</h1>
        <p class="subtitle">Brazil NFT Official Collection</p>

        <!-- PDF Embedded -->
        <div class="pdf-container">
            <iframe src="roadmap.pdf" title="Brazil NFT Roadmap"></iframe>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="social-icons">
            <a href="https://www.binance.com/pt-BR/square/profile/cos_investidores" target="_blank" title="Binance Square">
                <img src="assets/Bsquare.png" alt="Binance Square">
            </a>
            <a href="https://x.com/BrazilPfp" target="_blank" title="X / Twitter">
                <span>𝕏</span>
            </a>
            <a href="https://github.com/BrazilNFT-Oficial-Collection" target="_blank" title="Github">
                <img src="assets/git.png" alt="Github Profile">
            </a>
            <a href="https://cos.tv/channel-vip/room/172133888776684" target="_blank" title="VIP Room COStv">
                <img src="assets/salavip.png" alt="VIP Room COStv">
            </a>
            <a href="https://cos.tv/channel/51060419739952128/" target="_blank" title="Official COStv Channel">
                <img src="assets/costve.png" alt="Official COStv Channel">
            </a>
        </div>
      
        <div class="footer-text">
            <p>&copy; 2026 Brazil NFT Official Collection • All rights reserved</p>
            <p>Transparency is our commitment to the community.</p>
        </div>
    </footer>
</body>
</html>
