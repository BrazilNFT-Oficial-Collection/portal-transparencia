<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap - Brazil NFT Official Collection</title>
    
    <link rel="icon" href="https://github.com/BrazilNFT-Oficial-Collection.png" type="image/png">

    <style>
        :root {
            --primary: #00ff9d;
            --dark: #0A2540;
            --gray: #112B4A;
        }
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        body {
            background-color: var(--dark);
            color: #ffffff !important;
            font-family: 'Segoe UI', system-ui, sans-serif;
            line-height: 1.6;
        }
        header {
            background: rgba(10, 37, 64, 0.98);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 255, 157, 0.25);
        }
        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.85rem;
            font-weight: bold;
            color: #ffffff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            font-size: 3rem;
            margin: 3rem 0 2.5rem;
            color: #ffffff !important;
        }

        /* Menu limpo */
        .secondary-menu {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            margin: 2rem 0 3rem;
            flex-wrap: wrap;
        }
        .secondary-menu a {
            color: #ffffff !important;
            text-decoration: none;
            font-weight: 500;
            padding: 10px 24px;
            border-radius: 50px;
            transition: all 0.3s;
        }
        .secondary-menu a:hover,
        .secondary-menu a.active {
            background: rgba(0, 255, 157, 0.2);
            color: #ffffff !important;
        }

        .pdf-container {
            background: var(--gray);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(0, 255, 157, 0.25);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }
        iframe {
            width: 100%;
            height: 920px;
            border: none;
            border-radius: 12px;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.4rem; }
            .secondary-menu { gap: 1rem; }
            .secondary-menu a { padding: 9px 18px; font-size: 0.95rem; }
            iframe { height: 680px; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">🇧🇷 Brazil NFT</div>
        </nav>
    </header>

    <div class="container">
        <h1>Roadmap 2026</h1>

        <!-- Menu -->
        <div class="secondary-menu">
            <a href="index.html">Transparência</a>
            <a href="roadmap.html" class="active">Roadmap</a>
        </div>

        <div class="pdf-container">
            <iframe src="roadmap.pdf" title="Roadmap Brazil NFT"></iframe>
        </div>

        <p style="text-align: center; margin-top: 20px;">
            <a href="roadmap.pdf" target="_blank" style="color: var(--primary); font-weight: bold;">
                📥 Baixar Roadmap em PDF
            </a>
        </p>
    </div>
</body>
</html>
