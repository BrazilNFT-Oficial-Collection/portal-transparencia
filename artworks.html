<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artworks - Brazil NFT Official Collection</title>
    
    <link rel="icon" href="https://github.com/BrazilNFT-Oficial-Collection.png" type="image/png">

    <style>
        :root {
            --primary: #00ff9d;
            --dark: #0A2540;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--dark);
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        header {
            background: rgba(10, 37, 64, 0.98);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 255, 157, 0.25);
        }
        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.85rem;
            font-weight: bold;
            color: #ffffff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            font-size: 3rem;
            margin: 2.5rem 0 1rem;
        }
        .subtitle {
            text-align: center;
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 3rem;
        }

        .secondary-menu {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 2rem 0 3rem;
            flex-wrap: wrap;
        }
        .secondary-menu a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            padding: 10px 24px;
            border-radius: 50px;
            transition: all 0.3s;
        }
        .secondary-menu a:hover,
        .secondary-menu a.active {
            background: rgba(0, 255, 157, 0.2);
            color: #ffffff;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.8rem;
        }
        .art-card {
            background: #112B4A;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s;
            border: 1px solid rgba(0, 255, 157, 0.1);
        }
        .art-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 40px rgba(0, 255, 157, 0.2);
        }
        .art-card img {
            width: 100%;
            height: 340px;
            object-fit: cover;
        }
        .art-info {
            padding: 1.2rem;
            text-align: center;
        }
        .art-info h3 {
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        footer {
            background: #081f33;
            padding: 3rem 2rem 2rem;
            margin-top: 5rem;
            border-top: 1px solid rgba(0, 255, 157, 0.2);
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 2.2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .social-icons img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">🇧🇷 Brazil NFT</div>
        </nav>
    </header>

    <div class="container">
        <h1>Artworks</h1>
        <p class="subtitle">Brazil NFT Official Collection</p>

        <div class="secondary-menu">
            <a href="index.html">Transparência</a>
            <a href="roadmap.html">Roadmap</a>
            <a href="artworks.html" class="active">Artworks</a>
        </div>

        <div class="gallery">
            <div class="art-card">
                <img src="assets/panter (1).png" alt="Panter">
                <div class="art-info">
                    <h3>Panther</h3>
                </div>
            </div>

            <div class="art-card">
                <img src="assets/boaconstrictorsnake.png" alt="Boa Constrictor">
                <div class="art-info">
                    <h3>Boa Constrictor</h3>
                </div>
            </div>

            <div class="art-card">
                <img src="assets/capybara.png" alt="Capybara">
                <div class="art-info">
                    <h3>Capybara</h3>
                </div>
            </div>

            <div class="art-card">
                <img src="assets/manedwolf.png" alt="Maned Wolf">
                <div class="art-info">
                    <h3>Maned Wolf</h3>
                </div>
            </div>

            <div class="art-card">
                <img src="assets/capuchinmonkey.png" alt="Capuchin Monkey">
                <div class="art-info">
                    <h3>Capuchin Monkey</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="social-icons">
            <a href="https://www.binance.com/pt-BR/square/profile/cos_investidores" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/9/9a/Binance-BNB-Icon-Logo.wine.svg" alt="Binance">
            </a>
            <a href="https://x.com/BrazilPfp" target="_blank"><span style="font-size: 2.2rem;">𝕏</span></a>
            <a href="https://cos.tv/channel-vip/room/172133888776684" target="_blank">
                <img src="assets/salavip.png" alt="Sala Vip">
            </a>
            <a href="https://cos.tv/channel/51060419739952128/" target="_blank">
                <img src="https://play-lh.googleusercontent.com/w-YarljHAryHAiqPlND6cwr5dtLw1tUdB8cg_7Vo05iM9WTkyx-oVL4hw_2xeSFor6Q" alt="COStv">
            </a>
        </div>
    </footer>
</body>
</html>
