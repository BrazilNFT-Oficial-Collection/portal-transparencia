<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap - Brazil NFT Official Collection</title>
    
    <link rel="icon" href="https://github.com/BrazilNFT-Oficial-Collection.png" type="image/png">

    <style>
        :root {
            --primary: #00ff9d;
            --dark: #0A2540;
            --gray: #112B4A;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--dark);
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            line-height: 1.6;
        }
        header {
            background: rgba(10, 37, 64, 0.98);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 255, 157, 0.25);
        }
        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.85rem;
            font-weight: bold;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .menu {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }
        .menu a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        .menu a:hover { color: var(--primary); }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            margin: 3rem 0 2.5rem;
            color: var(--primary);
            font-size: 3rem;
        }
        .pdf-container {
            background: var(--gray);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(0, 255, 157, 0.25);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }
        iframe {
            width: 100%;
            height: 920px;
            border: none;
            border-radius: 12px;
        }
        .download {
            text-align: center;
            margin-top: 25px;
            font-size: 1.1rem;
        }
        @media (max-width: 768px) {
            iframe { height: 700px; }
            .menu { gap: 1.5rem; font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">🇧🇷 Brazil NFT</div>
            <ul class="menu">
                <li><a href="index.html">🏠 Transparência</a></li>
                <li><a href="roadmap.html">📍 Roadmap</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1>Roadmap 2026</h1>
        
        <div class="pdf-container">
            <iframe src="roadmap.pdf" title="Roadmap Brazil NFT Official Collection"></iframe>
        </div>
        
        <div class="download">
            📄 <a href="roadmap.pdf" target="_blank" style="color: var(--primary); font-weight: bold;">
                Clique aqui para baixar o Roadmap em PDF
            </a>
        </div>
    </div>
</body>
</html>
