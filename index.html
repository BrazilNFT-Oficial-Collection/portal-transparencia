<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal da Transparência - Brazil NFT Official Collection</title>
 
    <link rel="icon" href="https://github.com/BrazilNFT-Oficial-Collection.png" type="image/png">
    <style>
        :root {
            --primary: #00ff9d;
            --dark: #0A2540;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--dark);
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        header {
            background: rgba(10, 37, 64, 0.98);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 255, 157, 0.25);
        }
        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.85rem;
            font-weight: bold;
            color: #ffffff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            font-size: 3rem;
            margin: 2.5rem 0 0.5rem;
        }
        .subtitle {
            text-align: center;
            color: #ffffff;
            font-size: 1.5rem;
            margin-bottom: 2rem;
        }
        .secondary-menu {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            margin: 2rem 0 3rem;
            flex-wrap: wrap;
        }
        .secondary-menu a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            padding: 10px 24px;
            border-radius: 50px;
            transition: all 0.3s;
        }
        .secondary-menu a:hover,
        .secondary-menu a.active {
            background: rgba(0, 255, 157, 0.2);
            color: #ffffff;
        }
        .explorer-wrapper {
            width: 100%;
            max-width: 1100px;
            margin: 1.5rem auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 255, 157, 0.15);
        }
        .explorer-wrapper iframe {
            width: 100%;
            height: 720px;
            border: none;
        }

        /* FOOTER */
        footer {
            background: #ffffff !important;
            color: #0A2540;
            padding: 3rem 2rem 2rem;
            margin-top: 4rem;
            border-top: 1px solid rgba(0, 255, 157, 0.3);
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 2.2rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }
        .social-icons a {
            transition: all 0.3s;
        }
        .social-icons img {
            width: 52px;
            height: 52px;
            object-fit: contain;
        }
        .social-icons a:hover img {
            transform: translateY(-6px);
            filter: brightness(1.3);
        }

        /* Seção do Certificado */
        .certificates {
            text-align: left;
            max-width: 800px;
            margin: 2rem auto 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
        }
        .certificates h3 {
            font-size: 1rem;
            margin-bottom: 0.9rem;
            color: #0A2540;
            font-weight: 600;
        }
        .certificate-img {
            max-width: 200px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
            border: 3px solid #00ff9d;
            transition: all 0.3s ease;
        }
        .certificate-img:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 255, 157, 0.3);
        }

        .footer-text {
            text-align: center;
            color: #0A2540;
            font-size: 0.78rem;
            line-height: 1.4;
        }
        .footer-text p {
            margin-bottom: 0.35rem;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.4rem; }
            .subtitle { font-size: 1.3rem; }
            .secondary-menu { gap: 1rem; }
            .secondary-menu a { padding: 9px 18px; font-size: 0.95rem; }
            .explorer-wrapper iframe { height: 680px; }
            .social-icons img { width: 46px; height: 46px; }
            .certificate-img { max-width: 170px; }
            .certificates { text-align: center; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">🇧🇷 Brazil NFT</div>
        </nav>
    </header>

    <div class="container">
        <h1>Portal da Transparência</h1>
        <p class="subtitle">Brazil NFT Official Collection</p>
        
        <div class="secondary-menu">
            <a href="index.html" class="active">Transparência</a>
            <a href="roadmap.html">Roadmap</a>

        </div>

        <div class="explorer-wrapper">
            <iframe src="https://explorer.contentos.io/#/user-relevant/vulkan"
                    allowfullscreen

                    title="Contentos Explorer"></iframe>

    </div>

    <!-- RODAPÉ -->
    <footer>

                <img src="assets/Bsquare.png" alt="Binance Square">
            </a>
            <a href="https://x.com/BrazilPfp" target="_blank" title="X / Twitter">
                <span style="font-size: 2.4rem;">𝕏</span>
            </a>
            <a href="https://github.com/BrazilNFT-Oficial-Collection" target="_blank" title="Github">
                <img src="assets/git.png" alt="Perfil Github">
            </a>
            <a href="https://cos.tv/channel-vip/room/172133888776684" target="_blank" title="Sala Vip COStv">
                <img src="assets/salavip.png" alt="Sala Vip COStv">
            </a>
            <a href="https://cos.tv/channel/51060419739952128/" target="_blank" title="Canal Oficial COStv">
                <img src="assets/costve.png" alt="Canal COStv">
            </a>
        </div>

        </div>

        <div class="footer-text">
            <p>&copy; 2026 Brazil NFT Official Collection • Todos os direitos reservados</p>
            <p>Transparência é o nosso compromisso com a comunidade.</p>
        </div>
    </footer>
</body>
</html>
